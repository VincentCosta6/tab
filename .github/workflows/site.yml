name: Site

# Deploys site/ (tabqueue.com) to Cloudflare Pages. Pushes to main go to
# production; pull requests that touch the site get a preview URL.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs can't read the secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID aren't set, so the site wasn't deployed."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      # wrangler straight from npx: wrangler-action finds pnpm-lock.yaml at
      # the root and looks for pnpm, which this job doesn't need.
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - if: env.HAS_TOKEN == 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch="$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tabqueue' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
