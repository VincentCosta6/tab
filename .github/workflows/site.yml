name: Site

# Deploys site/ (tabqueue.com) to Cloudflare Pages. Pushes to main go to
# production; pull requests that touch the site get a preview URL.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs can't read the secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tabqueue' }} --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
