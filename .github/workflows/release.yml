# Builds tab's installers and publishes them on a GitHub release.
#
# Two ways to start it (docs/RELEASING.md has the full walkthrough):
#   1. Actions → Release → Run workflow, with a version like v1.2.3. The tag
#      and release are created only after every check and build passes.
#      Tick "dry run" to build everything without releasing (any branch).
#   2. Publish a release in the GitHub UI with a new vX.Y.Z tag. The
#      installers are attached to that release when the builds finish.
#
# Signing is optional. Every secret below may be missing: the build still
# runs, just unsigned (macOS gets an ad-hoc signature, Windows none), and
# adding the secrets later turns signing on with no workflow change.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like v1.2.3
        required: true
        type: string
      dry_run:
        description: Build and check everything, but don't create a release
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.version }}
          FROM_RELEASE: ${{ github.event_name == 'release' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(scripts/release/version.sh check "$TAG")"
          if [ "$FROM_RELEASE" = false ] && [ "$DRY_RUN" = false ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are cut from $DEFAULT_BRANCH. Run from $DEFAULT_BRANCH, or tick dry run to try another branch."
            exit 1
          fi
          # Every tag and release (drafts included) except, when a published
          # release started this run, that release's own tag.
          {
            git tag --list 'v*'
            gh release list --limit 1000 --json tagName --jq '.[].tagName'
          } | if [ "$FROM_RELEASE" = true ]; then grep -vxF "$TAG" || true; else cat; fi \
            | scripts/release/version.sh unique "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Releasing $TAG" >> "$GITHUB_STEP_SUMMARY"

  # The same checks every pull request runs: typecheck and build the UI, test
  # tab-core and the shared crates, Wasm build, proto lint and codegen.
  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  lint:
    name: Lint (rustfmt, clippy)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Correctness and suspicious lints block a release. Style lints only
      # warn, so a new Rust release adding a lint can't stop a ship.
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

  storage:
    name: Storage suite
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Too slow for every PR (see CLAUDE.md), so a release runs it instead.
      - run: scripts/storage-tests.sh --perf

  draft:
    name: Create draft release
    needs: [version, ci, lint, storage]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # A draft gets its tag only when it's published, so a failed build
          # leaves no tag behind. Re-running failed jobs reuses this draft.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="tab $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Build ${{ matrix.name }}
    needs: [version, ci, lint, storage, draft]
    # Runs when the draft was created, or skipped on purpose (a published
    # release, or a dry run), but never after a failed check.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.ci.result == 'success' &&
      needs.lint.result == 'success' && needs.storage.result == 'success' &&
      (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Signing secrets live in the "macos - dmg" environment, which only main and
    # v* tags may use. A dry run from another branch builds without it, so
    # unsigned. (An empty name means no environment.)
    environment: ${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) && 'macos - dmg' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Exports only the secrets that are set. Tauri treats an empty variable
      # as "set" and fails, so missing secrets must stay missing.
      - name: Signing setup
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          export_var() {
            local d="EOF_$RANDOM$RANDOM"
            { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >> "$GITHUB_ENV"
          }
          summary() { echo "- $*" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
              export_var APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
              export_var APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
              [ -n "$APPLE_SIGNING_IDENTITY" ] && export_var APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
              summary "Signed with Developer ID"
              if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
                key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
                printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
                export_var APPLE_API_KEY "$APPLE_API_KEY_ID"
                export_var APPLE_API_ISSUER "$APPLE_API_ISSUER"
                export_var APPLE_API_KEY_PATH "$key"
                summary "Notarized with an App Store Connect API key"
              elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                export_var APPLE_ID "$APPLE_ID"
                export_var APPLE_PASSWORD "$APPLE_PASSWORD"
                export_var APPLE_TEAM_ID "$APPLE_TEAM_ID"
                summary "Notarized with an Apple ID and app-specific password"
              else
                echo "::warning::Signed but not notarized: macOS will still warn on first open. Add the App Store Connect API key secrets."
                summary "**Not notarized** (no notarization secrets)"
              fi
            else
              echo "::warning::Unsigned macOS build (ad-hoc signature). Add APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD to sign it."
              summary "**Unsigned** (ad-hoc signature)"
            fi
          fi

          if [ "$RUNNER_OS" = Windows ]; then
            if [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ] \
               && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ]; then
              export_var AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
              export_var AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET"
              export_var AZURE_TENANT_ID "$AZURE_TENANT_ID"
              export_var AZURE_SIGNING_ENDPOINT "$AZURE_SIGNING_ENDPOINT"
              export_var AZURE_SIGNING_ACCOUNT "$AZURE_SIGNING_ACCOUNT"
              export_var AZURE_SIGNING_PROFILE "$AZURE_SIGNING_PROFILE"
              echo "SIGN_WINDOWS=1" >> "$GITHUB_ENV"
              summary "Signed with Azure Artifact Signing"
            else
              echo "::warning::Unsigned Windows build: SmartScreen will show \"Windows protected your PC\". See docs/RELEASING.md."
              summary "**Unsigned** (SmartScreen will warn)"
            fi
          fi

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            export_var TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && export_var TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            summary "Updater bundles signed"
          else
            summary "No updater bundles (no TAURI_SIGNING_PRIVATE_KEY)"
          fi

      - name: Install the Windows signing tool
        if: env.SIGN_WINDOWS == '1'
        run: cargo install artifact-signing-cli --locked

      - name: Release config
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # The updater's public key; the app embeds it to verify updates.
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          dir="$RUNNER_TEMP"
          # Forward slashes, so the path survives being passed as an argument.
          [ "$RUNNER_OS" = Windows ] && dir="$(cygpath -m "$dir")"
          node scripts/release/build-config.mjs "$dir/tauri.release.json"
          echo "RELEASE_CONFIG=$dir/tauri.release.json" >> "$GITHUB_ENV"

      - name: Build and upload
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config ${{ env.RELEASE_CONFIG }}
          # Empty on a dry run: build only, upload nothing.
          releaseId: ${{ github.event.release.id || needs.draft.outputs.release_id }}
          # latest.json for the updater; skipped when there are no .sig files.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Keep the installers on the run
        uses: actions/upload-artifact@v4
        with:
          name: tab-${{ needs.version.outputs.version }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            target/${{ matrix.target }}/release/bundle/msi/*.msi*
            target/${{ matrix.target }}/release/bundle/nsis/*.exe*

  # Not built yet. Tauri's iOS target needs `pnpm tauri ios init` (which
  # commits src-tauri/gen/apple), and tab's desktop engine (agents, local
  # hub, sandbox) doesn't run on iOS; the phone app will be a hub client.
  # docs/RELEASING.md lists the certificates and secrets it will use.
  ios:
    name: Build iOS (not set up yet)
    needs: [version]
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "pnpm tauri ios build --export-method app-store-connect"

  publish:
    name: Publish release
    needs: [version, draft, desktop]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq .html_url >> "$GITHUB_STEP_SUMMARY"
