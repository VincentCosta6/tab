name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it builds.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Releases check this too; catching it here keeps them from failing.
      - run: cargo fmt --all --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo test -p tab-core
      - run: cargo check -p tab
      # Shared logic, protocol and hub: fast. The full storage suite
      # (conformance, property, volume) runs outside CI with
      # scripts/storage-tests.sh; see CLAUDE.md.
      - run: cargo test -p tab-domain -p tab-protocol -p tab-hub
      - run: rustup target add wasm32-unknown-unknown
      - name: Shared crates build for Wasm (Cloudflare Workers)
        run: cargo check --target wasm32-unknown-unknown -p tab-domain -p tab-protocol -p tab-hub -p tab-store --features tab-store/sql
      - run: pnpm proto:lint
      - name: Generated TypeScript matches hub.proto
        run: pnpm proto && git diff --exit-code src/lib/protocol
