name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it builds.
  workflow_call:

jobs:
  # The macOS sandbox (Seatbelt) for real: the Linux job runs bubblewrap
  # only, and without TAB_REQUIRE_SANDBOX these tests would skip instead of
  # failing.
  sandbox-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tab-core --lib sandbox::
        env:
          TAB_REQUIRE_SANDBOX: "1"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev bubblewrap
      # tab's Linux sandbox (bubblewrap, as in the cloud runner) needs user
      # namespaces, which Ubuntu 24.04's AppArmor keeps from unprivileged
      # processes by default.
      - name: Let bubblewrap start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Releases check these too; catching them here keeps them from failing.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo test -p tab-core
        env:
          # The sandbox tests fail instead of skipping if bubblewrap can't start.
          TAB_REQUIRE_SANDBOX: "1"
      - run: cargo check -p tab
      # Shared logic, protocol and hub: fast. The full storage suite
      # (conformance, property, volume) runs outside CI with
      # scripts/storage-tests.sh; see CLAUDE.md.
      - run: cargo test -p tab-domain -p tab-protocol -p tab-hub
      - run: rustup target add wasm32-unknown-unknown
      - name: Shared crates build for Wasm (Cloudflare Workers)
        run: cargo check --target wasm32-unknown-unknown -p tab-domain -p tab-protocol -p tab-hub -p tab-store --features tab-store/sql
      - run: pnpm proto:lint
      - name: Generated TypeScript matches hub.proto
        run: pnpm proto && git diff --exit-code src/lib/protocol
