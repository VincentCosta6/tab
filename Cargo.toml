[workspace]
resolver = "2"
members = ["crates/tab-domain", "crates/tab-protocol", "crates/tab-store", "crates/tab-hub", "crates/tab-core", "crates/tab-runner", "src-tauri"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "FSL-1.1-MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "ws", "query"] }
futures-util = "0.3"
which = "7"
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
