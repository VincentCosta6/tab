# cargo-about: the third-party notices tab ships (scripts/licenses/notices.sh).
# Same list as deny.toml's [licenses] allow.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "FSL-1.1-MIT",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Its manifest names a license file but no license.
[model2vec-rs.clarify]
license = "MIT"

[[model2vec-rs.clarify.files]]
path = "LICENSE"
