[package]
name = "tab-core"
description = "Connector runtime, ranked work queue, and ranking for tab"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
tab-domain = { path = "../tab-domain" }
tab-protocol = { path = "../tab-protocol" }
prost = "0.14"
prost-types = "0.14"
tab-store = { path = "../tab-store", features = ["sqlite", "fs"] }
tab-hub = { path = "../tab-hub" }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
sha2.workspace = true
axum.workspace = true
futures-util.workspace = true
which.workspace = true
base64 = "0.22"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The hub's own listener: TLS 1.3 over TCP (HTTP/2 and HTTP/1.1) and QUIC (HTTP/3).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
webpki-roots = "1"
mail-parser = "0.11"
sqlite-vec = "0.1.6"
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "local-only"] }

# The cloud hub's sync socket.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

# MCP sign-ins (see remote_mcp::vault).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
