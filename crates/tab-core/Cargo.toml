[package]
name = "tab-core"
description = "Connector runtime, ranked work queue, and ranking for tab"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
axum.workspace = true
futures-util.workspace = true
which.workspace = true
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
sqlite-vec = "0.1.6"
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "local-only"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
