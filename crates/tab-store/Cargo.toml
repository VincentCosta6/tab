[package]
name = "tab-store"
description = "The storage interface a tab hub runs on, shaped around tab's operations, with its backends."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# Local SQLite backend (desktop, self-hosted). Off for Wasm builds.
sqlite = ["sql", "dep:rusqlite"]
# The shared, dialect-neutral tables and queries (sea-query).
sql = ["dep:sea-query"]
# The shared test suite every backend must pass. Backends that live in
# other crates (the Durable Object one) turn this on in their tests.
conformance = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde.workspace = true
serde_json.workspace = true
tab-domain = { path = "../tab-domain" }
rusqlite = { workspace = true, optional = true }
sea-query = { version = "1", optional = true, default-features = false, features = ["derive", "backend-sqlite", "backend-postgres"] }

[dev-dependencies]
tab-store = { path = ".", features = ["sqlite", "conformance"] }
tab-domain = { path = "../tab-domain" }
proptest = "1"
