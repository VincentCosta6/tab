# Its own workspace while the port runs alongside the Tauri app (see the root
# Cargo.toml). Once src-tauri is gone this joins the root workspace.
[workspace]

[package]
name = "tab-gpui"
description = "tab's desktop app on GPUI"
edition = "2024"
version = "0.1.0"
license = "FSL-1.1-MIT"

[[bin]]
name = "tab-gpui"
path = "src/main.rs"

[features]
# The sample-data connector, for trying the app and screenshots.
sample-data = ["tab-core/sample-data"]

[dependencies]
anyhow = "1"
tab-app = { path = "../tab-app" }
tab-core = { path = "../tab-core" }
chrono = "0.4"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
# GPUI (Apache-2.0, from Zed's repository) as the crates.io snapshots that
# gpui-component builds on. Both must be the exact versions gpui-component
# requires; bump the three together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland"] }
gpui-component = "=0.9.1"

# Its own workspace, so it doesn't inherit the root's release profile; keep
# the two in step.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
