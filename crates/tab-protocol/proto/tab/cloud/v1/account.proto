// The tab cloud account API: what the apps and the edge Worker
// (api.tabqueue.com, in the private tab-infra repo) exchange over HTTPS.
//
// This file is the source of truth for both sides. tab-infra builds against
// this crate, so the cloud and the apps share these exact types: prost
// generates the Rust, protobuf-es the TypeScript. Bodies are binary Protobuf
// (`content-type: application/x-protobuf`), success and error alike; the
// HTTP status says which message the body holds (2xx: the route's message,
// otherwise Error).
//
// Routes, all with `authorization: Bearer <Supabase access token>`:
//   GET  /v1/hub            HubStatus  your personal hub
//   POST /v1/hub            HubStatus  set up your personal hub (idempotent)
//   GET  /v1/hubs           HubList    every hub you belong to
//   GET  /v1/hubs/{hub_id}  HubStatus  one of them, if you're a member
//   PUT  /v1/hubs/{hub_id}/secrets  SecretNames   store or remove secrets
//                                                 (body PutSecrets; owner
//                                                 or admin)
//   GET  /v1/hubs/{hub_id}/secrets  SecretNames   their names, never values
//   GET  /v1/hubs/{hub_id}/runner   RunnerStatus  the hub's cloud runner
//   POST /v1/hubs/{hub_id}/runner   RunnerStatus  wake it (paid plans)
//   PUT  /v1/hubs/{hub_id}/files    StoredFile    store a file (members);
//                                                 the body is its raw bytes
//   GET  /v1/hubs/{hub_id}/files/{hex}            a file's raw bytes, by the
//                                                 hex of its sha256 (404
//                                                 Error when it isn't there);
//                                                 HEAD says whether it is
//
// Files (chat attachments, images an agent made) are the one exception to
// Protobuf bodies: they go up and come down as their own bytes, at most
// 50 MiB. The hub names each by its hash, keeps it while a record refers to
// it, and deletes it a day after nothing does.
//
// The cloud runner (tab running headless next to the hub, for connections
// set to run in tab cloud, workflows and agent jobs) calls one route of its
// own, with `authorization: Runner <token>`, a token the hub gave it:
//   GET  /v1/runner/secrets         Secrets       its hub's secrets, values
//                                                 included
// and syncs with its hub like any computer, at /v1/hubs/{hub_id}/sync (and
// /files) with `authorization: Bearer <token>`. A token is `tabrunner.<hub_id>.<secret>`;
// only the hub can say it's valid, and each start of the runner gets a new one.
//
// Same compatibility rules as hub.proto: only add; never renumber or reuse a
// field; reserve removed ones. `buf breaking` checks this.
syntax = "proto3";

package tab.cloud.v1;

import "google/protobuf/timestamp.proto";

// Where a hub is in being set up.
enum HubState {
  HUB_STATE_UNSPECIFIED = 0;
  // No hub yet. POST /v1/hub creates your personal one.
  HUB_STATE_NONE = 1;
  // Being created. Poll until it's ready.
  HUB_STATE_PROVISIONING = 2;
  HUB_STATE_READY = 3;
  // Setting up failed. POST /v1/hub tries again.
  HUB_STATE_FAILED = 4;
}

enum HubKind {
  HUB_KIND_UNSPECIFIED = 0;
  // A person's own hub.
  HUB_KIND_PERSONAL = 1;
  // A hub shared by a team.
  HUB_KIND_TEAM = 2;
}

// Your role on a hub.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Everything, including deleting the hub.
  ROLE_OWNER = 1;
  // Manages members and settings.
  ROLE_ADMIN = 2;
  // Reads and writes.
  ROLE_MEMBER = 3;
  // Reads only.
  ROLE_GUEST = 4;
}

// Your plan. Cloud features work while `active`.
message Plan {
  // "trial", "pro" or "none". A string so new plans don't need a new client.
  string name = 1;
  // When it ends. Unset for a plan that renews.
  google.protobuf.Timestamp ends_at = 2;
  bool active = 3;
}

message Hub {
  // A Durable Object id, 64 lowercase hex characters. Empty while state is NONE.
  string hub_id = 1;
  HubKind kind = 2;
  // What to call it. Empty for a personal hub.
  string name = 3;
  Role role = 4;
  HubState state = 5;
  // Cloudflare's region hint it was placed with, e.g. "wnam". May be empty.
  string region = 6;
  google.protobuf.Timestamp ready_at = 7;
  // Why the last setup failed, said for a person.
  string error = 8;
}

message HubStatus {
  Hub hub = 1;
  Plan plan = 2;
}

message HubList {
  // Personal hub first, then the rest by name.
  repeated Hub hubs = 1;
  Plan plan = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // No token, or one that didn't verify. Sign in again.
  ERROR_CODE_UNAUTHENTICATED = 1;
  // The trial or plan has ended.
  ERROR_CODE_PLAN_REQUIRED = 2;
  // The account is locked.
  ERROR_CODE_LOCKED = 3;
  // Too many requests. See the retry-after header.
  ERROR_CODE_RATE_LIMITED = 4;
  // No such hub, or not one you belong to. The two are never told apart.
  ERROR_CODE_NOT_FOUND = 5;
  // You belong to the hub but your role doesn't allow this.
  ERROR_CODE_FORBIDDEN = 6;
  ERROR_CODE_BAD_REQUEST = 7;
  // Our side. Try again.
  ERROR_CODE_INTERNAL = 8;
  // Set by the apps, never sent: tab cloud couldn't be reached.
  ERROR_CODE_UNREACHABLE = 9;
}

// The body of every non-2xx answer.
message Error {
  ErrorCode code = 1;
  // Said for a person; safe to show as is.
  string message = 2;
}

// A secret a hub keeps for its cloud runner: a connection's sign-in
// (`connection/<id>/<field>`), a harness's key (`harness/<id>/<ENV_VAR>`),
// or git access (`git/token`). Stored encrypted with the hub's own key, and
// only ever handed to that hub's cloud runner.
message Secret {
  string name = 1;
  string value = 2;
}

message PutSecrets {
  // Set (or replace) these.
  repeated Secret secrets = 1;
  // Then remove these, by name.
  repeated string remove = 2;
}

message SecretNames {
  repeated string names = 1;
}

message Secrets {
  repeated Secret secrets = 1;
}

enum RunnerState {
  RUNNER_STATE_UNSPECIFIED = 0;
  // Not running. It starts when there's work for it, or on POST.
  RUNNER_STATE_ASLEEP = 1;
  RUNNER_STATE_STARTING = 2;
  RUNNER_STATE_RUNNING = 3;
  // The plan doesn't include a cloud runner.
  RUNNER_STATE_NOT_ON_PLAN = 4;
}

message RunnerStatus {
  RunnerState state = 1;
  // When it last checked in.
  google.protobuf.Timestamp seen_at = 2;
  // Said for a person: why it's asleep, or what it's doing.
  string detail = 3;
}

// A file the hub now has.
message StoredFile {
  // `sha256:<hex>` of its bytes, as records refer to it.
  string hash = 1;
  uint64 size = 2;
}
