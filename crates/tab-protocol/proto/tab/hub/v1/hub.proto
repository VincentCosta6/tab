// The messages tab's apps (desktop, phone, runners, CLI) and a hub exchange.
//
// This file is the source of truth. Rust types are generated by prost
// (crates/tab-protocol/build.rs) and TypeScript types by protobuf-es
// (buf.gen.yaml at the repo root). There is no gRPC: these messages are
// sent as binary WebSocket frames to the hub, or passed in-process when the
// hub runs inside the desktop app.
//
// Compatibility rules, enforced by `buf breaking` in CI:
// - Only add. New fields and messages are fine.
// - Never renumber or reuse a field number. Removed fields go in `reserved`.
// - A change clients can't ignore needs a new PROTOCOL_VERSION.
syntax = "proto3";

package tab.hub.v1;

import "google/protobuf/timestamp.proto";

// Every frame on the wire is one of these.
message ClientEnvelope {
  // Protocol version the sender speaks.
  uint32 protocol_version = 1;
  // Set by the client; the reply carries the same id.
  uint64 request_id = 2;
  oneof body {
    Hello hello = 10;
    Apply apply = 11;
    GetChanges get_changes = 12;
    GetRecord get_record = 13;
    ClaimLease claim_lease = 14;
    ReleaseLease release_lease = 15;
    Search search = 16;
    GetNeighbors get_neighbors = 17;
    GetHubStatus get_hub_status = 18;
    Watch watch = 19;
    Publish publish = 20;
    Steer steer = 21;
  }
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  // The request this answers, or 0 for a push.
  uint64 request_id = 2;
  oneof body {
    Welcome welcome = 10;
    Applied applied = 11;
    Changes changes = 12;
    RecordReply record = 13;
    LeaseClaim lease_claim = 14;
    Released released = 15;
    LeasesExpired leases_expired = 16;
    SearchResults search_results = 17;
    Neighbors neighbors = 18;
    Error error = 19;
    HubStatus hub_status = 20;
    Delivered delivered = 21;
    Live live = 22;
    Steered steered = 23;
    Watched watched = 24;
  }
}

// ---- Data ----

// One change. Record bodies are JSON objects, sent as UTF-8 JSON bytes so
// connectors can describe items freely without a schema change here.
message Op {
  oneof op {
    Put put = 1;
    Delete delete = 2;
    Link link = 3;
    Unlink unlink = 4;
  }
}

message Put {
  string kind = 1;
  string id = 2;
  bytes body_json = 3;
}

message Delete {
  string kind = 1;
  string id = 2;
}

message Link {
  string from = 1;
  string to = 2;
  string rel = 3;
}

message Unlink {
  string from = 1;
  string to = 2;
  string rel = 3;
}

// An entry of the hub's change log.
message AppliedOp {
  uint64 seq = 1;
  Op op = 2;
  // Device or person that made it.
  string by = 3;
  google.protobuf.Timestamp at = 4;
}

message Record {
  string kind = 1;
  string id = 2;
  bytes body_json = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Edge {
  string from = 1;
  string to = 2;
  string rel = 3;
}

message Lease {
  string key = 1;
  string holder = 2;
  uint64 token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message SearchHit {
  string kind = 1;
  string id = 2;
  uint64 seq = 3;
}

// ---- Requests ----

// First message on a connection.
message Hello {
  // Stable id of this device or runner.
  string device = 1;
  // App and version, for support and compatibility.
  string client = 2;
  // Last change this device has.
  uint64 since = 3;
}

// Writes a batch, all or nothing.
message Apply {
  repeated Op ops = 1;
}

// Changes after `since`, oldest first.
message GetChanges {
  uint64 since = 1;
  // 0 means the hub's default page size.
  uint32 limit = 2;
}

message GetRecord {
  string kind = 1;
  string id = 2;
}

// Claims or renews a lease.
message ClaimLease {
  string key = 1;
  uint32 ttl_secs = 2;
}

message ReleaseLease {
  string key = 1;
}

message Search {
  string query = 1;
  uint32 limit = 2;
}

// Edges from or to a node in the knowledge graph.
message GetNeighbors {
  string node = 1;
  uint32 limit = 2;
}

// What the hub is doing: for the Hub page in Settings.
message GetHubStatus {}

// ---- Live sessions (watch and steer) ----
//
// An agent session runs on one device: the holder of the lease
// `session:<id>` if anyone holds it, otherwise the device named in the
// `device` field of the session's record (kind `sessions`, id `["<id>"]`).
// Its stored transcript syncs like any other record. What doesn't belong
// in the change log (streamed text, tool progress, approval prompts) goes
// over this live channel instead: the runner publishes it, and the hub
// relays it to the connections watching that session without storing it.
// The other way, any device can steer a session (send a message, answer an
// approval, stop it); the hub routes that to the runner.

// The sessions this connection wants live events for. Replaces the
// previous set; empty stops watching. Each newly watched session's runner
// is sent `Watched`, so it can publish a snapshot (text streamed so far,
// open approvals) for the late joiner.
message Watch {
  repeated string sessions = 1;
}

// A live event from the device running `session`. Only that device may
// publish for it. `event_json` is the app's own event (UTF-8 JSON), passed
// through untouched.
message Publish {
  string session = 1;
  bytes event_json = 2;
}

// A message for the device running `session`: steering text, an approval
// answer, a stop. `body_json` is the app's own command (UTF-8 JSON).
message Steer {
  string session = 1;
  bytes body_json = 2;
}

// ---- Replies and pushes ----

message Welcome {
  // The protocol version the hub will use with this client.
  uint32 protocol_version = 1;
  // Latest change in the hub.
  uint64 head = 2;
}

message Applied {
  uint64 first = 1;
  uint64 last = 2;
}

// Reply to GetChanges, and pushed to other clients when something changes.
message Changes {
  repeated AppliedOp changes = 1;
  uint64 head = 2;
  // More are waiting; ask again from the last seq.
  bool more = 3;
}

message RecordReply {
  // Unset when there's no such record.
  Record record = 1;
}

message LeaseClaim {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_GRANTED = 1;
    OUTCOME_RENEWED = 2;
    // Someone else holds it; `lease` is theirs.
    OUTCOME_HELD = 3;
  }
  Outcome outcome = 1;
  Lease lease = 2;
}

message Released {
  bool released = 1;
}

// Leases that lapsed, pushed so runners can pick the work up.
message LeasesExpired {
  repeated Lease leases = 1;
}

message SearchResults {
  repeated SearchHit hits = 1;
}

message Neighbors {
  repeated Edge edges = 1;
}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    // Didn't parse or failed validation.
    CODE_BAD_REQUEST = 1;
    // The protocol version is too old or too new.
    CODE_UNSUPPORTED = 2;
    // A lease or fence check failed.
    CODE_CONFLICT = 3;
    // Storage failed; retrying may work.
    CODE_INTERNAL = 4;
  }
  Code code = 1;
  string message = 2;
}

message HubStatus {
  // Where this hub runs: "local" (inside the desktop app) or "cloud".
  string runs_on = 1;
  uint32 protocol_version = 2;
  google.protobuf.Timestamp started_at = 3;
  // Latest change.
  uint64 head = 4;
  uint64 records = 5;
  uint64 edges = 6;
  uint64 live_leases = 7;
  // Storage used, as the backend measures it.
  uint64 storage_bytes = 8;
  repeated Connection connections = 9;
  // Filled in by the host when it can measure them. Unset in the cloud,
  // where a Durable Object can't see its own CPU or memory.
  Resources resources = 10;
}

// A device or runner connected to the hub.
message Connection {
  uint64 id = 1;
  // Empty until it says hello.
  string device = 2;
  string client = 3;
  // Where it connected from, as the host sees it.
  string address = 4;
  google.protobuf.Timestamp connected_at = 5;
  // The last change the hub has sent it; head minus this is how far behind it is.
  uint64 synced_to = 6;
}

message Resources {
  // Of one core, so a busy multi-threaded process can exceed 100.
  double cpu_percent = 1;
  uint64 memory_bytes = 2;
}

// Reply to Watch, Publish and Steer: how many connections the hub passed
// it to (for Watch, the runner connections told about the change).
// Publishers can skip publishing while nobody watches.
message Delivered {
  uint32 connections = 1;
}

// Pushed to a session's watchers.
message Live {
  string session = 1;
  // The device that published it.
  string from = 2;
  bytes event_json = 3;
}

// Pushed to the device running `session`.
message Steered {
  string session = 1;
  // The device that sent it.
  string from = 2;
  bytes body_json = 3;
}

// Pushed to the device running `session` when its watchers change.
message Watched {
  string session = 1;
  // Connections watching now.
  uint32 watchers = 2;
}
